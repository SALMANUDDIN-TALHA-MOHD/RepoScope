  <!-- 1. RepoService -->
  <rect x="72" y="356" width="192" height="140" rx="5" fill="#F57F17" stroke="#E65100" stroke-width="1.5"/>
  <rect x="72" y="356" width="192" height="28" rx="5" fill="#E65100"/>
  <rect x="72" y="376" width="192" height="8" fill="#E65100"/>
