  <rect x="282" y="356" width="192" height="28" rx="5" fill="#7F0000"/>
  <rect x="282" y="376" width="192" height="8" fill="#7F0000"/>
  <text x="378" y="375" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#FFF">TDD Detector  ★</text>
  <line x1="282" y1="384" x2="474" y2="384" stroke="#FFCDD2" stroke-width="0.8"/>
  <text x="378" y="402" text-anchor="middle" font-size="8.5" fill="#FFCDD2">analyse(commits[])</text>
