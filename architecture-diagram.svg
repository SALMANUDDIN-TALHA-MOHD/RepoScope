  <text x="600" y="656" text-anchor="middle" font-size="9" fill="#BBDEFB">Calculates health score (0–100)</text>
  <text x="600" y="678" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFF">✓ Built — Week 3</text>

