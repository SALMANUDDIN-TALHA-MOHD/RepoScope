  <text x="970" y="128" text-anchor="middle" font-size="9" fill="#CFD8DC">File tree · Source file contents</text>
  <text x="970" y="142" text-anchor="middle" font-size="9" fill="#CFD8DC">Commit history (last 100 commits)</text>
  <text x="1120" y="174" text-anchor="end" font-size="8" fill="#78909C" font-style="italic">« external »</text>

