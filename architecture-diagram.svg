  <text x="243" y="678" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFF">✓ Week 1 (schema) · Week 4 (live)</text>

  <!-- Scan Orchestrator -->
  <rect x="445" y="558" width="310" height="140" rx="6" fill="#1565C0" stroke="#0D47A1" stroke-width="1.5"/>
