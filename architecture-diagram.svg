  <line x1="48" y1="46" x2="1152" y2="46" stroke="#BDBDBD" stroke-width="1"/>

  <!-- ═══ LAYER 1: CLIENT (y 54 to 180) ═══ -->
  <rect x="48" y="54" width="1104" height="126" rx="6" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1.2"/>
  <text x="68" y="72" font-size="9.5" font-weight="bold" fill="#1565C0" letter-spacing="2">CLIENT LAYER</text>

  <!-- React Frontend box -->
  <rect x="88" y="80" width="220" height="84" rx="6" fill="#1565C0" stroke="#0D47A1" stroke-width="1.5"/>
  <text x="198" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFF">React Frontend</text>
