  <text x="378" y="468" text-anchor="middle" font-size="8" fill="#FFCDD2">3 feedback tiers</text>
  <text x="378" y="487" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFF">✓ Week 3 (Prof.★)</text>

