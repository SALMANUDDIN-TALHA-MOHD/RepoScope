  <text x="168" y="468" text-anchor="middle" font-size="8" fill="#FFF8E1">GitHub REST API</text>
  <text x="168" y="487" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFF">✓ Week 3</text>

