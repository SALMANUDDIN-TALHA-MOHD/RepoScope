  <line x1="72" y1="384" x2="264" y2="384" stroke="#FFF3E0" stroke-width="0.8"/>
  <text x="168" y="402" text-anchor="middle" font-size="8.5" fill="#FFF3E0">fetchFileTree()</text>
  <text x="168" y="418" text-anchor="middle" font-size="8.5" fill="#FFF3E0">fetchFileContent()</text>
  <text x="168" y="434" text-anchor="middle" font-size="8.5" fill="#FFF3E0">fetchCommits()</text>
